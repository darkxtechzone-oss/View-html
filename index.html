<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DarkX Team - Video</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080b12;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px 20px;
      background: #111827;
      border-bottom: 1px solid #263244;
    }

    header h1 {
      margin: 0;
      color: #38bdf8;
      font-size: 24px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .video-container {
      width: 100%;
      aspect-ratio: 9 / 16;
      max-width: 420px;
      margin: auto;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
    }

    .video-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .details {
      max-width: 420px;
      margin: 20px auto;
    }

    .details h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .details p {
      color: #aab5c5;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      color: #718096;
      padding: 25px;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <h1>DarkX Video</h1>
  </header>

  <main>
    <div class="video-container">
      <iframe
        src="https://videobb.com/embed/vt2uhe5"
        title="DarkX Team Video"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen
        loading="lazy">
      </iframe>
    </div>

    <section class="details">
      <h2>DarkX Team</h2>
      <p>
        Watch this video on DarkX Video.
        Enjoy the content!
      </p>
    </section>
  </main>

  <footer>
    © 2026 DarkX Video. All rights reserved.
  </footer>
</body>
</html>
